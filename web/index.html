<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱 · 浮窗画布</title>
<link rel="stylesheet" href="/notemap/styles.css">
<link rel="stylesheet" href="/notemap/litegraph.css">
</head>
<body>
<div id="nm-toolbar">
<input id="nm-search" type="text" placeholder="搜索知识…" autocomplete="off">
<button id="nm-add" title="New note">＋ note</button>
<button id="nm-import" title="导入资料(粘贴文本/URL 成为知识节点)">📥 资料</button>
<button id="nm-sessions" title="从 DSH 会话提取知识(checkpoint 摘要 + 用户问题)">🗨 会话</button>
<button id="nm-clear" title="清空工作区(需确认)">🧹 清空</button>
<button id="nm-layout" title="Re-layout (force) ">⟳ layout</button>
<button id="nm-fit" title="Fit graph">⛶ fit</button>
<span id="nm-count"></span>
</div>
<div id="nm-stage"><canvas id="nm-canvas"></canvas></div>
<div id="nm-inspector" hidden><button id="nm-inspector-close" title="Close">×</button><h3 id="nm-inspector-title"></h3><div id="nm-inspector-body"></div><div id="nm-inspector-related"></div><button id="nm-inspector-delete" style="margin-top:8px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:6px;padding:4px 10px;cursor:pointer;">🗑 删除节点</button></div>
<script src="/notemap/litegraph.js"></script>
<script src="/notemap/app.js"></script>
</body>
</html>
